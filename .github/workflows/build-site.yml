name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'skills/dpdp-analyze/references/**'
      - 'tools/build_site.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown
      - run: python tools/build_site.py
      - name: Commit rebuilt site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "chore: rebuild site from reference sources"
          git push
