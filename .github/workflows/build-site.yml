name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'skills/dpdp-analyze/**'
      - 'tools/**'
      - 'DISCLAIMER.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so each page's lastmod is its source's real commit date
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown
      - run: python tools/build_site.py
      - name: Commit rebuilt site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "chore: rebuild site from reference sources"
          git push
      - name: Ping IndexNow (Bing, which feeds ChatGPT search and Copilot)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python tools/indexnow.py "${{ github.event.before }}" HEAD
          else
            python tools/indexnow.py all
          fi
